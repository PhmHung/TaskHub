[project]
name = "taskhub-backend"
version = "0.1.0"
description = "TaskHub FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.23.2",
    "pydantic[email]>=2.5.3",
    "pydantic-settings>=2.1.0",
    "asyncmy",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.1",
    "python-multipart>=0.0.32",
    "bcrypt<4.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "httpx>=0.25.2",
    "mypy>=1.8.0",
    "ruff>=0.1.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
